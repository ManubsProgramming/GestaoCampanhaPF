<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sistema de gestão de pessoas cadastradas"
  >
<title>Gestão Campanha PF</title>

<meta
  name="description"
  content="Gestão Campanha PF - sistema de gestão e organização de campanha."
>

<meta
  name="robots"
  content="index, follow"
>

<link
  rel="canonical"
  href="https://gestaocampanhapf.up.railway.app/"
>
  <title>Gestão de Cadastros</title>

  <link
    rel="icon"
    href="assets/imagens/prefeitura-icon.png"
  >

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">

<script src="js/api.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/login.js" defer></script></head>

<body>
  <main class="login-page">
    <section class="login-card">
      <header class="login-brand">
        <img
          src="assets/imagens/prefeitura-icon.png"
          alt="Logo do sistema"
          class="login-logo"
        >

        <div>
          <h1>Gestão de Cadastros</h1>
          <p>Acesso ao sistema</p>
        </div>
      </header>

      <div class="login-heading">
        <h2>Bem-vindo</h2>

        <p>
          Entre com seus dados para continuar.
        </p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-field">
          <label for="usuario">
            E-mail ou usuário
          </label>

          <input
            id="usuario"
            name="usuario"
            type="text"
            placeholder="Digite seu e-mail ou usuário"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-field">
          <div class="form-label-row">
            <label for="senha">
              Senha
            </label>

            <button
              id="forgot-password"
              class="text-button"
              type="button"
            >
              Esqueci minha senha
            </button>
          </div>

          <div class="password-wrapper">
            <input
              id="senha"
              name="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button
              id="password-toggle"
              class="password-toggle"
              type="button"
              aria-label="Mostrar senha"
            >
              Mostrar
            </button>
          </div>
        </div>

        <p
          id="login-message"
          class="login-message"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          id="login-button"
          class="primary-button"
          type="submit"
        >
          Entrar
        </button>
      </form>

      <footer class="login-footer">
        Sistema de gestão de pessoas cadastradas
      </footer>
    </section>
  </main>
</body>
</html>
